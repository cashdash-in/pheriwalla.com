<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">

<title>Order</title>
<style>
  :root { --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --brand:#0f766e; --brand-soft:#e6f4f1; --bg:#f6f7f8; --bad:#b91c1c; --warn:#9a3412; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif; color:var(--ink); background:var(--bg); padding-bottom:96px; }
  header { background:var(--brand); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5; }
  header img { width:34px; height:34px; border-radius:8px; background:#fff; object-fit:contain; }
  header b { font-size:17px; } header small { display:block; font-size:12.5px; opacity:.9; }
  header a { margin-left:auto; color:#fff; font-size:13px; border:1px solid rgba(255,255,255,.6); border-radius:999px; padding:5px 10px; text-decoration:none; white-space:nowrap; }
  main { max-width:620px; margin:0 auto; padding:12px; display:grid; gap:12px; }
  .box { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; }
  .gal { display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory; border-radius:12px; }
  .gal > * { flex:none; width:100%; aspect-ratio:4/5; object-fit:cover; border-radius:12px; scroll-snap-align:start; background:#e5e7eb; }
  .gal.many > * { width:86%; }
  h1 { font-size:19px; margin:2px 0 4px; } .price { font-size:24px; font-weight:800; color:var(--brand); }
  .desc { white-space:pre-line; font-size:14px; color:#374151; line-height:1.45; margin-top:8px; }
  .lbl { font-size:13.5px; font-weight:600; margin:0 0 6px; display:block; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:9px 14px; font-size:15px; cursor:pointer; font-family:inherit; }
  .chip.on { border-color:var(--brand); background:var(--brand-soft); font-weight:700; }
  .qty { display:inline-flex; align-items:center; border:1.5px solid var(--line); border-radius:10px; overflow:hidden; }
  .qty button { width:44px; height:42px; border:0; background:#f9fafb; font-size:20px; cursor:pointer; }
  .qty span { width:48px; text-align:center; font-size:17px; font-weight:700; }
  input, textarea { width:100%; font:inherit; font-size:16px; padding:11px 12px; border:1.5px solid var(--line); border-radius:10px; background:#fff; }
  textarea { min-height:74px; resize:vertical; }
  .f { display:grid; gap:10px; } .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .err { color:var(--bad); font-size:13.5px; min-height:0; }
  .sum { display:grid; gap:4px; font-size:14.5px; } .sum div { display:flex; justify-content:space-between; }
  .sum .t { font-size:17px; font-weight:800; border-top:1px solid var(--line); padding-top:6px; margin-top:4px; }
  .terms { font-size:12.5px; color:var(--muted); } .terms a { color:var(--brand); }
  .foot { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px; align-items:center; z-index:6; }
  .foot[hidden], header a[hidden], header img[hidden] { display:none; }
  .foot .info { flex:1; font-size:13px; color:var(--muted); } .foot .info b { display:block; font-size:18px; color:var(--ink); }
  .go { background:var(--brand); color:#fff; border:0; border-radius:12px; padding:14px 22px; font-size:16px; font-weight:800; cursor:pointer; font-family:inherit; text-decoration:none; display:inline-block; text-align:center; }
  .go:disabled { opacity:.55; } .go.ghost { background:#fff; color:var(--brand); border:1.5px solid var(--brand); }
  .center { text-align:center; } .big { font-size:42px; }
  .steps { display:grid; gap:0; } .st { display:flex; gap:10px; align-items:flex-start; padding:6px 0; color:var(--muted); font-size:14.5px; }
  .st i { width:22px; height:22px; border-radius:50%; border:2px solid var(--line); flex:none; margin-top:1px; }
  .st.done { color:var(--ink); } .st.done i { background:var(--brand); border-color:var(--brand); }
  .st.now { color:var(--ink); font-weight:700; } .st.now i { border-color:var(--brand); box-shadow:inset 0 0 0 4px #fff; background:var(--brand); }
  .note { background:#fff7ed; color:var(--warn); border-radius:10px; padding:10px 12px; font-size:14px; }
  .qr { width:220px; max-width:70%; border-radius:12px; border:1px solid var(--line); display:block; margin:8px auto; }
  .empty { text-align:center; color:var(--muted); padding:60px 20px; font-size:15px; line-height:1.5; }
  .muted { color:var(--muted); font-size:13.5px; }
  .askbtn { display:block; text-align:center; background:#16a34a; color:#fff; text-decoration:none; font-weight:600; padding:13px; border-radius:12px; }
  .ends { display:inline-block; margin-top:6px; background:#111827; color:#fff; font-size:12.5px; font-weight:600; padding:4px 9px; border-radius:999px; }
  .ends.soon { background:#b91c1c; }
</style>

      ${P.desc ? `<div class="desc">${esc(P.desc)}</div>` : ""}<p class="muted" style="margin:8px 0 0">${esc(P.code)}</p></div>
    ${P.sizes.length ? `<div class="box"><span class="lbl">${L.size}</span><div class="chips" id="sizes">${P.sizes.map((s) => `<button class="chip ${sel.size === s ? "on" : ""}" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>` : ""}
    ${!P.price ? `<div class="box"><p style="margin:0 0 10px">${L.noPrice}</p>${P.chat ? `<a class="askbtn" href="${esc(P.chat)}?text=${encodeURIComponent(`${P.code} — ${P.title}`)}">${L.ask}</a>` : ""}</div>` : `
    <div class="box"><span class="lbl">${L.qty}</span><div class="qty"><button data-q="-1">−</button><span id="qn">1</span><button data-q="1">+</button></div></div>
    <div class="box f"><span class="lbl">${L.details}</span>
      <input id="nm" autocomplete="name" placeholder="${L.name}" value="${esc(saved.name || "")}">
      <input id="ph" inputmode="tel" autocomplete="tel" placeholder="${L.phone}" value="${esc(saved.phone || "")}">
      <textarea id="ad" autocomplete="street-address" placeholder="${L.addr}">${esc(saved.address || "")}</textarea>
      <div class="two"><input id="pn" inputmode="numeric" maxlength="6" autocomplete="postal-code" placeholder="${L.pin}" value="${esc(saved.pin || "")}"><span></span></div></div>
    <div class="box"><span class="lbl">${L.pay}</span><div class="chips" id="pays">
      <button class="chip" data-p="cod">💵 ${L.cod}</button>${P.upi ? `<button class="chip" data-p="upi">📱 ${L.upi}</button>` : ""}</div></div>
    <div class="box sum" id="sum"></div>
    <p class="terms">${L.terms(esc(P.terms))}</p>
    <div class="err" id="err"></div>`}`;
  if (!P.price) { $("foot").hidden = true; return; }
  if (!P.upi) sel.pay = "cod";
  paint();
  $("place").textContent = L.place; $("foot").hidden = false;
}
function paint() {
  document.querySelectorAll("[data-s]").forEach((b) => b.classList.toggle("on", b.dataset.s === sel.size));
  document.querySelectorAll("[data-p]").forEach((b) => b.classList.toggle("on", b.dataset.p === sel.pay));
  if ($("qn")) $("qn").textContent = sel.qty;
  const t = totals();
  $("sum").innerHTML = `<div><span>${L.price}${P.price ? ` (${rs(P.price)} × ${sel.qty})` : ""}</span><span>${P.price ? rs(t.sub) : "—"}</span></div>
    <div><span>${L.delivery}</span><span>${Number(P.fee) > 0 ? rs(P.fee) : L.free}</span></div>
    <div class="t"><span>${L.total}</span><span>${rs(t.total)}</span></div>`;
  $("finfo").innerHTML = `${L.total}<b>${rs(t.total)}</b>`;
}
document.addEventListener("click", (e) => {
  const s = e.target.closest("[data-s]"); if (s) { sel.size = s.dataset.s; paint(); return; }
  const q = e.target.closest("[data-q]"); if (q) { sel.qty = Math.min(20, Math.max(1, sel.qty + Number(q.dataset.q))); paint(); return; }
  const p = e.target.closest("[data-p]"); if (p) { sel.pay = p.dataset.p; paint(); return; }
});
$("place").addEventListener("click", async () => {
  if (!P) return;
  const body = { size: sel.size, qty: sel.qty, pay: sel.pay, name: $("nm").value, phone: $("ph").value, address: $("ad").value, pin: $("pn").value };
  const err = (k) => { $("err").textContent = L["e_" + k] || L.e_try; $("err").scrollIntoView({ behavior: "smooth", block: "center" }); };
  if (P.sizes.length && !sel.size) return err("size");
  if (body.name.trim().length < 2) return err("name");
  if (!/^(?:\+?91|0)?[6-9]\d{9}$/.test(body.phone.replace(/[\s-]/g, ""))) return err("phone");
  if (body.address.trim().length < 8 || !/^[1-9]\d{5}$/.test(body.pin.trim())) return err("address");
  if (!sel.pay) return err("pay");
  $("place").disabled = true; $("place").textContent = L.placing; $("err").textContent = "";
  try {
    const r = await fetch(`${API}?o=${encodeURIComponent(TOK)}&act=place`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || d.error) { err(d.error === "try_again" ? "try" : d.error || "try"); return; }
    store.set("rr_customer", { name: body.name.trim(), phone: body.phone.trim(), address: body.address.trim(), pin: body.pin.trim() });
    history.replaceState(null, "", `order.html?k=${encodeURIComponent(d.key)}`);
    done(d);
  } catch { err("try"); } finally { $("place").disabled = false; $("place").textContent = L.place; }
});

/* ---------------- after placing / tracking ---------------- */
function payBlock(d, amount) {
  return `<div class="box center"><p>${L.upiNote(rs(amount), esc(d.shop))}</p>
    ${d.upi ? `<a class="go" href="${esc(d.upi)}">${L.payNow}</a>` : ""}
    ${d.qr ? `<img class="qr" src="${esc(d.qr)}" alt="UPI QR">` : ""}
    ${d.vpa ? `<p class="muted">${L.vpa}: <b>${esc(d.vpa)}</b></p>` : ""}
    <button class="go ghost" id="paid" style="margin-top:6px">✅ ${L.paidBtn}</button></div>`;
}
function wirePaid(key) {
  const b = $("paid"); if (!b) return;
  b.onclick = async () => {
    b.disabled = true;
    try { await fetch(`${API}?k=${encodeURIComponent(key)}&act=paid`, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }); } catch {}
    b.outerHTML = `<p><b>${L.paidThanks}</b></p>`;
  };
}
function done(d) {
  $("foot").hidden = true;
  $("main").innerHTML = `<div class="box center"><div class="big">✅</div><h1>${L.thanks}</h1><p class="muted">${L.orderNo(d.id)}</p>
      ${d.pay === "cod" ? `<p>${L.codNote(rs(d.total), esc(d.shop))}</p>` : ""}</div>
    ${d.pay === "upi" ? payBlock(d, d.total) : ""}
    <div class="box center"><a class="go ghost" href="order.html?k=${encodeURIComponent(d.key)}">📍 ${L.track}</a><p class="muted">${L.save}</p></div>`;
  wirePaid(d.key);
}
const FLOW = ["placed", "sent_to_supplier", "accepted", "dispatched", "delivered"];
function renderTrack(o) {
  head(o);
  const stopped = ["cancelled", "out_of_stock"].includes(o.status);
  const at = FLOW.indexOf(o.status);
  const steps = stopped ? `<div class="note">${L.st[o.status]}. ${L.stopped}</div>`
    : `<div class="steps">${FLOW.map((s, i) => `<div class="st ${i < at ? "done" : i === at ? "now" : ""}"><i></i><span>${L.st[s]}</span></div>`).join("")}</div>`;
  const payTxt = o.paid === "paid" ? L.p_paid : o.paid === "claimed" ? L.p_claimed : o.pay === "cod" ? L.p_unpaid_cod : L.p_unpaid_upi;
  $("main").innerHTML = `<div class="box"><p class="muted" style="margin:0">${L.orderNo(o.id)}</p><h1>${esc(o.title)}</h1>
      <p class="muted" style="margin:0">${[o.size, `× ${o.qty}`].filter(Boolean).map(esc).join(" · ")} · <b>${rs(o.total)}</b> · ${payTxt}</p></div>
    <div class="box"><span class="lbl">${L.status}</span>${steps}
      ${o.tracking ? `<p class="muted">🚚 ${L.courier}: ${/^https?:/.test(o.tracking) ? `<a href="${esc(o.tracking)}" target="_blank" rel="noopener">${esc(o.tracking)}</a>` : esc(o.tracking)}</p>` : ""}</div>
    ${o.upi || o.qr ? payBlock(o, o.total) : ""}
    <div class="box"><span class="lbl">${L.deliverTo}</span><div class="desc" style="margin:0">${esc(o.name)}\n${esc(o.address)}</div></div>
    <p class="muted center">${L.save}</p>`;
  wirePaid(KEY);
}

(async () => {
  try {
    if (KEY) {
      const r = await fetch(`${API}?k=${encodeURIComponent(KEY)}`, { cache: "no-store" });
      const d = await r.json();
      if (!r.ok || d.error) return msg(T.en.gone);
      return renderTrack(d);
    }
    if (!TOK) return msg(T.en.gone);
    const r = await fetch(`${API}?o=${encodeURIComponent(TOK)}`, { cache: "no-store" });
    const d = await r.json();
    if (d.shop) head(d);
    if (!r.ok || d.error) return msg(`${L.gone}${d.chat ? `<br><br><a class="go" href="${esc(d.chat)}">${L.chat}</a>` : ""}`);
    if (d.soldOut) return msg(`${L.sold(esc(d.title))}<br>${L.askSeller}${d.chat ? `<br><br><a class="go" href="${esc(d.chat)}">${L.chat}</a>` : ""}`);
    P = d; renderForm(); endsTick(); setInterval(endsTick, 30000);
  } catch { msg(T.en.e_try); }
})();
// Countdown: how long the product stays on sale.
function endsTick() {
  const el = document.getElementById("ends"); if (!el || !P?.ends) return;
  const ms = new Date(P.ends).getTime() - Date.now();
  if (ms <= 0) { el.textContent = L.endsNow; return; }
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  el.textContent = L.ends(d ? L.dh(d, h % 24) : h ? L.hm(h, m % 60) : L.mm(Math.max(1, m)));
  el.classList.toggle("soon", ms < 24 * 3600000);
}
</script>
</body>
