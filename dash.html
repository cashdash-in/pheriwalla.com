<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="robots" content="noindex">

<style>

          --good:#15803d; --warn:#b45309; --bad:#b91c1c; --bar:#0f766e; --bar2:#5b6abf; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--brand); color:#fff; padding:14px 16px 12px; position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-size:19px; font-weight:700; display:flex; align-items:center; gap:8px; }
  header p { margin:3px 0 0; font-size:13px; opacity:.9; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  header a { color:#fff; }
  .live { display:inline-flex; align-items:center; gap:5px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#86efac; box-shadow:0 0 0 0 rgba(134,239,172,.7); animation:pulse 2s infinite; }
  .dot.off { background:#fca5a5; animation:none; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(134,239,172,.7)} 70%{box-shadow:0 0 0 7px rgba(134,239,172,0)} 100%{box-shadow:0 0 0 0 rgba(134,239,172,0)} }
  .bar { display:flex; gap:8px; padding:10px 12px; background:#fff; border-bottom:1px solid var(--line); overflow-x:auto; }
  .chip { flex:none; border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 14px; font-size:14px; color:var(--ink); cursor:pointer; }
  .chip.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  main { padding:12px; max-width:1100px; margin:0 auto; display:grid; gap:12px; }
  .tiles { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .two > * + * { margin-top:12px; }
  @media (min-width:720px) { .two > * + * { margin-top:0; } .tiles { grid-template-columns:repeat(4,1fr); } .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; } }
  .tile, .box { background:var(--card); border-radius:12px; padding:12px 14px; border:1px solid var(--line); }
  .tile small { color:var(--muted); font-size:12.5px; display:block; }
  .tile b { font-size:24px; display:block; margin-top:4px; font-variant-numeric:tabular-nums; letter-spacing:-.3px; }
  .tile span { font-size:12px; color:var(--muted); }
  .box h2 { margin:0 0 10px; font-size:15px; }
  .att { display:grid; gap:8px; }
  .att div { display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:14px; padding:9px 10px; border-radius:9px; background:#f9fafb; }
  .att div.hot { background:#fff7ed; }
  .att div.hot b { color:var(--warn); }
  .att b { font-variant-numeric:tabular-nums; font-size:15px; }
  .att .ok { color:var(--muted); font-size:13.5px; background:none; padding:2px 0; }
  .chart { position:relative; }
  .chart svg { display:block; width:100%; height:auto; overflow:visible; }
  .chart .tip { position:absolute; pointer-events:none; background:#111827; color:#fff; font-size:12.5px; padding:6px 8px; border-radius:7px; white-space:nowrap; transform:translate(-50%,-110%); display:none; }
  .meter { height:10px; background:#eef0f2; border-radius:999px; overflow:hidden; margin-top:8px; }
  .meter i { display:block; height:100%; background:var(--brand); border-radius:999px; }
  .meter.w i { background:var(--warn); } .meter.d i { background:var(--bad); }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  td, th { padding:8px 4px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  td small { color:var(--muted); display:block; font-size:12px; }
  .pill { display:inline-block; font-size:11.5px; padding:2px 7px; border-radius:999px; background:#eef0f2; color:var(--ink2); white-space:nowrap; margin:1px 0; }
  .pill.g { background:#dcfce7; color:#166534; } .pill.w { background:#ffedd5; color:#9a3412; } .pill.b { background:#fee2e2; color:#991b1b; } .pill.i { background:#e0e7ff; color:#3730a3; }
  .funnel { display:flex; gap:6px; align-items:stretch; }
  .funnel div { flex:1; background:#f9fafb; border-radius:9px; padding:8px; text-align:center; }
  .funnel b { display:block; font-size:20px; font-variant-numeric:tabular-nums; }
  .funnel small { color:var(--muted); font-size:12px; }
  .funnel em { align-self:center; color:var(--muted); font-style:normal; }
  .empty, .err { text-align:center; color:var(--muted); padding:48px 24px; font-size:15px; line-height:1.5; }
  .muted { color:var(--muted); font-size:13px; }

// Single-series bar chart: one hue, rounded tops on the baseline, 2px gaps, hover/tap tooltip.
function barChart(id, title, series, key, fmt, color, half = false) {
  // draw at the real on-screen width so text stays 11–12px on phones and desktops alike
  const inner = Math.min(1100, document.documentElement.clientWidth) - 24 - 30;
  const W = Math.max(280, Math.round(half && innerWidth >= 720 ? (inner - 12) / 2 : inner)), H = 170, pl = 30, pb = 22, pt = 8;
  const n = series.length, max = Math.max(1, ...series.map((s) => Number(s[key]) || 0));
  const step = Math.pow(10, Math.floor(Math.log10(max)));
  let top = Math.ceil(max / step) * step; if (top % 2) top += step;
  const bw = (W - pl) / n, gap = Math.min(6, bw * 0.25);
  const y = (v) => pt + (H - pt - pb) * (1 - v / top);
  const every = Math.ceil(n / 8);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">`;
  for (const t of [0, top / 2, top]) s += `<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="#e5e7eb"/><text x="${pl - 6}" y="${y(t) + 4}" font-size="11" fill="#6b7280" text-anchor="end">${t >= 1000 ? Math.round(t / 1000) + "k" : Math.round(t)}</text>`;
  series.forEach((d, i) => {
    const v = Number(d[key]) || 0, x = pl + i * bw + gap / 2, w = bw - gap, h = (H - pt - pb) * (v / top), r = Math.min(4, w / 2, h);
    if (v > 0) s += `<path d="M${x},${y(0)} V${y(v) + r} Q${x},${y(v)} ${x + r},${y(v)} H${x + w - r} Q${x + w},${y(v)} ${x + w},${y(v) + r} V${y(0)} Z" fill="${color}"/>`;
    s += `<rect class="hit" data-i="${i}" x="${pl + i * bw}" y="${pt}" width="${bw}" height="${H - pt - pb}" fill="transparent"/>`;
    if (i % every === 0 || i === n - 1) s += `<text x="${pl + i * bw + bw / 2}" y="${H - 6}" font-size="11" fill="#6b7280" text-anchor="middle">${esc(n === 1 ? d.d : String(parseInt(d.d)))}</text>`;
  });
  s += `</svg>`;
  return `<div class="box"><h2>${esc(title)}</h2><div class="chart" id="${id}" data-key="${key}">${s}<div class="tip"></div></div></div>`;
}
function wireCharts() {
  document.querySelectorAll(".chart").forEach((el) => {
    const tip = el.querySelector(".tip"), key = el.dataset.key;
    const show = (e) => {
      const r = e.target.closest(".hit"); if (!r) { tip.style.display = "none"; return; }
      const d = data.series[+r.dataset.i], box = el.getBoundingClientRect(), rb = r.getBoundingClientRect();
      tip.innerHTML = `<b>${esc(d.d)}</b> · ${key === "messages" ? num(d.messages) : `${num(d.orders)} ${L.orders.toLowerCase()} · ${rs(d.sales)}`}`;
      tip.style.left = `${rb.left - box.left + rb.width / 2}px`; tip.style.top = `${rb.top - box.top + 10}px`; tip.style.display = "block";
    };
    el.addEventListener("pointermove", show); el.addEventListener("pointerdown", show);
    el.addEventListener("pointerleave", () => (tip.style.display = "none"));
  });
}

function pills(o) {
  const st = o.status, cls = st === "delivered" ? "g" : st === "dispatched" ? "i" : ["cancelled", "out_of_stock"].includes(st) ? "b" : st === "placed" ? "w" : "";
  let p = `<span class="pill ${cls}">${esc(L.st[st] || st)}</span> `;
  p += `<span class="pill ${o.pay_status === "paid" ? "g" : o.pay_status === "claimed" ? "w" : ""}">${o.pay_method === "cod" ? L.cod : L.upi} · ${esc(L.pay[o.pay_status] || o.pay_status || "")}</span>`;
  if (o.return_status) p += ` <span class="pill b">${L.ret}: ${esc(o.return_status)}</span>`;
  return p;
}

    <td>${esc(o.title || o.code)}${o.size ? ` · ${esc(o.size)}` : ""} × ${o.qty}<small>${esc(o.code)} · ${esc(role === "supplier" ? (o.reseller || "") : (o.customer || ""))}</small>${pills(o)}</td>
    <td class="n">${rs(o.amount)}</td></tr>`).join("")}</table></div>`;
}

  if (!rows?.length) return "";

}
function funnel(d) {

  return `<div class="tiles">
      ${tile(L.orders, num(d.orders), d.cancelled ? L.cancelled(d.cancelled) : "")}
      ${tile(L.sales, rs(d.sales), d.orders ? L.avg(rs(d.sales / d.orders)) : "")}
      ${tile(L.profit, rs(d.profit))}
      ${tile(L.customers, num(d.customers))}</div>
    ${attention([[L.a_new, p.new, 0, 1], [L.a_claim, m.cust_claimed, 0, 1], [L.a_supdue, m.sup_due, 1, 1], [L.a_returns, d.returns_open, 0, 1],
      [L.a_with, p.with_supplier], [L.a_way, p.on_the_way], [L.a_custdue, m.cust_unpaid, 1], [L.a_cod, m.cod_open, 1]])}
    ${barChart("c1", L.chart_orders, d.series, "orders", num, "var(--bar)")}
    <div class="two">${funnel(d)}${topList(L.top, d.top_products, (r) => `${esc(r.title || r.code)}<small>${esc(r.code)}</small>`, (r) => num(r.orders))}</div>
    ${recent(d.recent, "reseller")}`;
}
function renderSupplier(d) {
  const p = d.pipeline, m = d.money;
  return `<div class="tiles">
      ${tile(L.orders, num(d.orders), d.cancelled ? L.cancelled(d.cancelled) : "")}
      ${tile(L.revenue, rs(d.supplier_value))}
      ${tile(L.resellers, num(d.resellers), L.active(d.active_resellers))}
      ${tile(L.photos, num(d.photos))}</div>
    ${attention([[L.a_accept, p.with_supplier, 0, 1], [L.a_dispatch, p.accepted, 0, 1], [L.a_supclaim, m.sup_claimed, 0, 1], [L.a_joins, d.pending_resellers, 0, 1],
      [L.a_returns, d.returns_open, 0, 1], [L.a_way, p.on_the_way], [L.a_suprecv, m.sup_due, 1]])}
    ${barChart("c1", L.chart_orders, d.series, "orders", num, "var(--bar)")}
    <div class="two">${topList(L.top, d.top_products, (r) => `${esc(r.title || r.code)}<small>${esc(r.code)}</small>`, (r) => num(r.orders))}
      ${topList(L.topres, d.top_resellers, (r) => esc(r.name), (r) => `${num(r.orders)} · ${rs(r.value)}`)}</div>
    ${funnel(d)}
    ${recent(d.recent, "supplier")}`;
}
function renderAdmin(d) {
  const ms = d.messages, share = ms.month_sent / ms.cap;
  return `<div class="tiles">
      ${tile(L.orders, num(d.orders), `${num(d.customers)} ${L.customers.toLowerCase()}`)}
      ${tile(L.gmv, rs(d.gmv))}
      ${tile(L.sup_active, num(d.suppliers.active), `+${d.suppliers.new} new · ${d.suppliers.pending} pending`)}
      ${tile(L.res_total, num(d.resellers.total), `${L.active(d.resellers.active)} · +${d.resellers.new} new`)}</div>
    <div class="two">
      <div class="box"><h2>${L.msgs}</h2><b style="font-size:24px">${num(ms.month_sent)}</b> <span class="muted">/ ${num(ms.cap)}</span>
        <div class="meter ${share >= .95 ? "d" : share >= .8 ? "w" : ""}"><i style="width:${Math.min(100, share * 100).toFixed(1)}%"></i></div>
        <p class="muted">${Math.round(share * 100)}% · ${num(ms.inbound_people)} people wrote to the bot ${days === 1 ? "today" : `in ${days} days`}${ms.capped ? ` · ${L.capped(ms.capped)}` : ""}</p></div>
      ${tile(L.income, rs(d.income.month), `${rs(d.income.period)} ${days === 1 ? "today" : `in ${days} days`}`)}</div>
    ${attention([[L.h_held, d.held_posts, 0, 1], [L.h_pend, d.suppliers.pending, 0, 1], [L.h_joins, d.resellers.pending_joins, 0, 1],
      [L.h_capped, ms.capped, 0, 1], [L.h_err, ms.errors, 0, 1]])}
    <div class="two">${barChart("c1", L.chart_orders, d.series, "orders", num, "var(--bar)", true)}${barChart("c2", L.chart_msgs, d.series, "messages", num, "var(--bar2)", true)}</div>
    <div class="two">${topList(L.topsup, d.top_suppliers, (r) => `${esc(r.name)}<small>${esc(r.code || "")}</small>`, (r) => `${num(r.orders)} · ${rs(r.gmv)}`)}
      ${topList(L.topres, d.top_resellers, (r) => esc(r.name), (r) => `${num(r.orders)} · ${rs(r.gmv)}`)}</div>
    ${funnel(d)}
    ${topList(L.signups, d.signups, (r) => `${esc(r.name)}<small>${L.kind[r.kind]} · ${esc(r.status || "")}</small>`, (r) => ago(r.created_at))}`;
}

function render() {
  const d = data;
  L = { ...T.en, ...(T[d.lang] || {}) };
  document.documentElement.lang = d.lang || "en";
  $("title").textContent = L.title[d.role] + (d.name && d.role !== "admin" ? ` · ${d.name}` : "");
  const rt = d.rating;
  $("who").textContent = rt ? `${L.rating}: ${rt.stars ? "★" + Number(rt.stars).toFixed(1) : L.newr}` : "";
  if (A) { $("cat").hidden = false; $("cat").href = `invite.html?a=${encodeURIComponent(A)}`; $("cat").textContent = "📨 Invite suppliers →"; }
  if (C) { $("cat").hidden = false; $("cat").href = `./?c=${encodeURIComponent(C)}`; $("cat").textContent = L.cat; }
  $("days").innerHTML = DAYS.map((n) => `<button class="chip ${n === days ? "on" : ""}" data-d="${n}">${L.days[n]}</button>`).join("");
  $("main").innerHTML = d.role === "admin" ? renderAdmin(d) : d.role === "supplier" ? renderSupplier(d) : renderReseller(d);
  wireCharts();
  tick();
}
function tick() {
  if (!lastAt) return;
  const s = Math.round((Date.now() - lastAt) / 1000);
  $("dot").classList.toggle("off", failed);
  $("upd").textContent = failed ? L.offline : L.live(s);
}

async function load() {
  clearTimeout(timer);
  if (!C && !A) { $("main").innerHTML = `<div class="err">${T.en.bad}</div>`; return; }
  try {
    const u = `${API}?${A ? `a=${encodeURIComponent(A)}` : `c=${encodeURIComponent(C)}`}&dash=1&days=${days}`;
    const res = await fetch(u, { cache: "no-store" });
    if (res.status === 404) { $("main").innerHTML = `<div class="err">${(T[data?.lang] || T.en).bad}</div>`; return; }
    if (!res.ok) throw new Error(res.status);
    data = await res.json(); lastAt = Date.now(); failed = false;
    render();
  } catch {
    failed = true; tick();
    if (!data) $("main").innerHTML = `<div class="err">${T.en.err}</div>`;
  }
  if (!document.hidden) timer = setTimeout(load, failed ? 8000 : REFRESH);
}
$("days").addEventListener("click", (e) => {
  const b = e.target.closest("[data-d]"); if (!b) return;
  days = +b.dataset.d; try { localStorage.setItem("rr_dash_days", days); } catch {}
  load();
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); else clearTimeout(timer); });
setInterval(tick, 1000);
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => data && render(), 200); });
load();
</script>
</body>
</html>
