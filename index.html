<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="robots" content="noindex">
<link rel="manifest" href="shop.webmanifest">
<link rel="apple-touch-icon" href="lib/icon-192.png">
<title>My catalogue · Resell Ready</title>
<style>
  :root { --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --brand:#0f766e; --brand-soft:#e6f4f1; --red:#c1121f; --bg:#f6f7f8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--brand); color:#fff; padding:14px 16px 12px; position:sticky; top:0; z-index:5; }
  .dashbtn { float:right; color:#fff; text-decoration:none; font-size:13px; font-weight:600; border:1px solid rgba(255,255,255,.6); border-radius:999px; padding:5px 10px; margin-left:8px; }
  .tools2 { display:flex; gap:8px; padding:10px 12px 0; overflow-x:auto; }
  .tools2 a, .tools2 button { flex:none; display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--brand); color:var(--brand); border-radius:10px; padding:9px 12px; font-size:14px; font-weight:600; text-decoration:none; font-family:inherit; cursor:pointer; }
  .live { margin-top:6px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12.5px; color:var(--muted); }
  .live button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:5px 8px; font:inherit; font-size:12.5px; color:var(--ink); cursor:pointer; }
  .timer { position:absolute; right:6px; bottom:6px; background:rgba(17,24,39,.78); color:#fff; font-size:11.5px; font-weight:600; padding:3px 7px; border-radius:999px; }
  .timer.soon { background:#b91c1c; }
  .badge { background:#dc2626; color:#fff; border-radius:999px; font-size:11px; padding:1px 6px; margin-left:4px; }
  .ochips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .orow { border-top:1px solid var(--line); padding:10px 0; font-size:13.5px; display:grid; gap:3px; }
  .orow .top { display:flex; justify-content:space-between; gap:8px; } .orow .st { font-weight:600; white-space:nowrap; }
  .orow small { color:var(--muted); } .orow a { color:var(--brand); font-weight:600; text-decoration:none; margin-right:10px; }
  .ohint { font-size:12.5px; color:var(--muted); margin:0 0 8px; }
  .fld { display:grid; gap:5px; margin:0 0 12px; font-size:13.5px; color:var(--muted); }
  .fld input { font:inherit; font-size:16px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; color:var(--ink); }
  .savebtn { width:100%; background:var(--brand); color:#fff; border:0; border-radius:12px; padding:13px; font:inherit; font-size:15.5px; font-weight:600; cursor:pointer; }
  #editBox, #ordersBox, #endedBox { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  #endedBox[hidden], #ordersBox[hidden], #editBox[hidden] { display:none; }
  #editBox .sheet, #ordersBox .sheet, #endedBox .sheet { background:#fff; width:100%; max-width:640px; max-height:85vh; overflow:auto; border-radius:16px 16px 0 0; padding:14px 14px calc(14px + env(safe-area-inset-bottom)); }
  #editBox h3, #ordersBox h3, #endedBox h3 { margin:0 0 10px; font-size:17px; display:flex; justify-content:space-between; align-items:center; }
  #editBox h3 button, #ordersBox h3 button, #endedBox h3 button { border:0; background:none; font:inherit; font-size:14px; color:var(--brand); cursor:pointer; }
  .erow { display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .erow img { width:56px; height:68px; object-fit:cover; border-radius:8px; background:#eef0f2; flex:none; }
  .erow div { flex:1; min-width:0; font-size:13.5px; } .erow small { display:block; color:var(--muted); }
  .erow button { flex:none; border:1px solid var(--brand); color:var(--brand); background:#fff; border-radius:9px; padding:8px 10px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; }
  .tools2 img { width:22px; height:22px; border-radius:5px; object-fit:contain; background:#fff; }
  header h1 { margin:0; font-size:19px; font-weight:700; }
  header p { margin:2px 0 0; font-size:13px; opacity:.85; }
  .bar { display:flex; gap:8px; padding:10px 12px; overflow-x:auto; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:62px; z-index:4; }
  .chip { flex:none; border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 14px; font-size:14px; color:var(--ink); }
  .chip.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  .tools { display:flex; flex-wrap:wrap; gap:8px; padding:10px 12px 0; }
  .tools input { flex:1 1 100% !important; }
  .tools input, .tools select { flex:1; min-width:0; font-size:15px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  .hint { margin:10px 12px 0; padding:10px 12px; background:var(--brand-soft); border-radius:10px; font-size:13.5px; line-height:1.4; }
  .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; padding:12px 12px 120px; }
  @media (min-width:640px) { .grid { grid-template-columns:repeat(3, 1fr); } }
  @media (min-width:960px) { .grid { grid-template-columns:repeat(5, 1fr); max-width:1200px; margin:0 auto; } }
  .card { background:#fff; border-radius:12px; overflow:hidden; border:2px solid transparent; position:relative; }
  .card.sel { border-color:var(--brand); }
  .pic { position:relative; aspect-ratio:4/5; background:#eef0f2; }
  .pic img, .pic video { width:100%; height:100%; object-fit:cover; display:block; }
  .play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:52px; height:52px; border-radius:50%; border:0; background:rgba(0,0,0,.55); color:#fff; font-size:22px; padding-left:4px; }
  .btns { display:flex; gap:6px; }
  .btns .one { flex:1; }
  .viewer { position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:50; display:flex; align-items:center; justify-content:center; }
  .ready { position:fixed; left:12px; right:12px; bottom:84px; z-index:20; display:flex; gap:8px; }
  .ready .go { flex:1; background:var(--brand); color:#fff; border:0; border-radius:12px; padding:14px; font-size:16px; font-weight:700; box-shadow:0 6px 20px rgba(0,0,0,.2); }
  .ready .x { background:#fff; border:1px solid var(--line); border-radius:12px; padding:0 16px; font-size:16px; }
  .viewer { flex-direction:column; gap:12px; padding:56px 8px 20px; }
  .viewer .vwrap { flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; }
  .viewer video { max-width:100%; max-height:100%; width:100%; background:#000; }
  .viewer .vclose { position:absolute; top:12px; right:12px; background:#fff; border:0; border-radius:999px; padding:8px 14px; font-size:15px; }
  .viewer .vmsg { color:#fecaca; font-size:14px; text-align:center; margin:0 16px; }
  .viewer .vopen { color:#fff; font-size:15px; border:1px solid rgba(255,255,255,.6); border-radius:999px; padding:9px 16px; text-decoration:none; }
  .price { position:absolute; right:6px; top:6px; background:var(--red); color:#fff; font-weight:700; font-size:14px; padding:3px 8px; border-radius:8px; }
  .tick { position:absolute; left:6px; top:6px; width:28px; height:28px; border-radius:50%; border:2px solid #fff; background:rgba(0,0,0,.25); display:grid; place-items:center; color:#fff; font-weight:700; }
  .card.sel .tick { background:var(--brand); }
  .count { position:absolute; left:6px; bottom:6px; background:rgba(0,0,0,.55); color:#fff; font-size:12px; padding:2px 7px; border-radius:6px; }
  .meta { padding:8px 9px 9px; }
  .meta b { display:block; font-size:13.5px; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta small { display:block; color:var(--muted); font-size:12px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .desc { font-size:12.5px; color:#374151; margin-top:4px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-line; }
  .desc.open { -webkit-line-clamp:unset; display:block; }
  .stars { font-size:12.5px; margin-top:4px; color:#b45309; font-weight:600; }
  .stars span { color:var(--muted); font-weight:400; }
  .noprice { position:absolute; right:6px; top:6px; background:rgba(0,0,0,.55); color:#fff; font-size:12px; padding:3px 7px; border-radius:8px; }
  .one { margin-top:7px; width:100%; border:1px solid var(--brand); color:var(--brand); background:#fff; border-radius:8px; padding:7px; font-size:13.5px; font-weight:600; }
  .foot { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); display:none; gap:8px; align-items:center; z-index:6; box-shadow:0 -4px 16px rgba(0,0,0,.06); }
  .foot.show { display:flex; }
  .foot .n { font-size:14px; font-weight:600; margin-right:auto; }
  .btn { border:0; border-radius:10px; padding:12px 14px; font-size:15px; font-weight:600; }
  .btn.main { background:#25d366; color:#fff; }
  .btn.alt { background:#eef0f2; color:var(--ink); }
  .empty, .err { text-align:center; color:var(--muted); padding:48px 24px; font-size:15px; line-height:1.5; }
  .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#111827; color:#fff; padding:10px 14px; border-radius:10px; font-size:14px; max-width:90vw; z-index:9; opacity:0; transition:opacity .2s; pointer-events:none; text-align:center; }
  .toast.show { opacity:1; }
  .busy { position:fixed; inset:0; background:rgba(255,255,255,.7); display:none; place-items:center; z-index:8; font-size:15px; font-weight:600; }
  .busy.show { display:grid; }
</style>
</head>
<body>
<header><a id="dash" class="dashbtn" hidden>📊 <span></span></a><h1 id="title">…</h1><p id="sub"></p></header>
<div class="bar" id="days"></div>
<div class="tools"><input id="q" type="search" autocomplete="off"><select id="sup" hidden></select><select id="sort"></select></div>
<div class="tools2" id="tools2" hidden></div>
<div id="editBox" hidden><div class="sheet"><h3><span id="editT"></span><button id="editX"></button></h3>
  <label class="fld"><span id="editNameL"></span><input id="editName" maxlength="80"></label>
  <label class="fld"><span id="editPriceL"></span><input id="editPrice" inputmode="numeric" maxlength="9"></label>
  <button id="editSave" class="savebtn"></button></div></div>
<div id="ordersBox" hidden><div class="sheet"><h3><span id="ordersT"></span><button id="ordersX"></button></h3><p class="ohint" id="ohint"></p><div class="ochips" id="ochips"></div><div id="ordersL"></div></div></div>
<div id="endedBox" hidden><div class="sheet"><h3><span id="endedT"></span><button id="endedX"></button></h3><div id="endedL"></div></div></div>
<input id="fLogo" type="file" accept="image/*" hidden>
<div class="hint" id="hint"></div>
<main class="grid" id="grid"></main>
<div class="foot" id="foot">
  <span class="n" id="n"></span>
  <button class="btn alt" id="clear"></button>
  <button class="btn alt" id="web" hidden></button>
  <button class="btn main" id="share"></button>
</div>
<div class="toast" id="toast"></div>
<div class="busy" id="busy"></div>

const DAYS = [0, 1, 3, 7]; // 0 = everything live now
const $ = (id) => document.getElementById(id);
// the link's key; opened from the home-screen icon, the page uses the one saved last time
const tok = new URLSearchParams(location.search).get("c") || location.hash.slice(1) || (() => { try { return localStorage.getItem("rr_cat_tok") || ""; } catch { return ""; } })();
let L = T.en, data = null, days = 0, ver = null;
const picked = new Set();

function toast(msg, ms = 2600) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), ms); }
function busy(on) { $("busy").textContent = L.wait; $("busy").classList.toggle("show", on); }
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const rupees = (n) => "₹" + Math.round(n).toLocaleString("en-IN");

function labels() {
  document.documentElement.lang = data?.lang || "en";
  $("title").textContent = data?.shop ? `${L.title} · ${data.shop}` : L.title;
  $("q").placeholder = L.search;
  $("hint").innerHTML = L.hint;
  $("share").textContent = L.share; $("clear").textContent = L.clear; $("web").textContent = L.web;
  const so = $("sort").value || "new";
  $("sort").innerHTML = `<option value="new">${L.newest}</option><option value="pop">${L.popular}</option>`;
  $("sort").value = so;
  $("days").innerHTML = DAYS.map((d, i) => `<button class="chip${d === days ? " on" : ""}" data-d="${d}">${L.days[i]}</button>`).join("");
}

async function load(quiet) {
  if (!tok) { $("grid").innerHTML = `<div class="err">${L.bad}</div>`; labels(); return; }
  if (!quiet) busy(true);
  try {
    const res = await fetch(`${API}?c=${encodeURIComponent(tok)}&days=${days}`, { cache: "no-store" });
    if (res.status === 404) { $("grid").innerHTML = `<div class="err">${L.bad}</div>`; return; }
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
    L = T[data.lang] || T.en;
    try { localStorage.setItem("rr_cat_tok", tok); if (data.role === "supplier") localStorage.setItem("rr_sup_tok", tok); } catch {}
    labels();
    const sel = $("sup");
    sel.hidden = !(data.suppliers?.length > 1);
    if (!sel.hidden) {
      const cur = sel.value;
      sel.innerHTML = `<option value="">${L.all}</option>` + data.suppliers.map((s) => `<option value="${s.id}">${esc(s.name)}${s.stars ? ` ★${Number(s.stars).toFixed(1)}` : ""}</option>`).join("");
      sel.value = cur;
    }
    $("web").hidden = !data.web;
    render();
  } catch (e) {
    $("grid").innerHTML = `<div class="err">${L.fail}</div>`;
  } finally { busy(false); }
}

function visible() {
  const q = $("q").value.trim().toLowerCase(), s = $("sup").value;
  const list = (data?.products || []).filter((p) => (!s || p.sid === s) && (!q || `${p.title} ${p.desc || ""} ${p.code} ${p.supplier || ""} ${p.price || ""} ${p.sizes.join(" ")}`.toLowerCase().includes(q)));
  return $("sort").value === "pop" ? [...list].sort((a, b) => (b.orders || 0) - (a.orders || 0)) : list;
}

const fmtDay = (iso) => new Date(iso).toLocaleDateString((data?.lang || "en") + "-IN", { day: "numeric", month: "short" });

// Supplier: extend a product, mark it sold out, or re-list ended ones.
$("grid").addEventListener("click", async (e) => {
  const ext = e.target.closest("[data-ext]"), sold = e.target.closest("[data-sold]"), ed = e.target.closest("[data-edit]");
  if (!ext && !sold && !ed) return;
  e.stopPropagation();
  if (ed) { openEdit(Number(ed.dataset.edit)); return; }
  try {
    if (sold) {
      if (!confirm(L.soldAsk)) return;
      await RR.call("sold", { key: Number(sold.dataset.sold) }); toast(L.soldOk, 3500); load(); return;
    }
    const v = prompt(L.extAsk, "7");
    if (v === null) return;
    const d = Number(String(v).trim());
    if (!Number.isInteger(d) || d < 0 || d > 90) { alert(L.extAsk); return; }
    const r = await RR.call("relist", { key: Number(ext.dataset.ext), days: d });
    toast(L.extOk(r.live_until === "infinity" ? L.always : L.till(fmtDay(r.live_until))), 3500); load();
  } catch { toast(L.tryAgain, 3500); }
}, true);
// Supplier: edit a product's name and price.
let editKey = null;
function openEdit(key) {
  const p = (data?.products || []).find((x) => x.key === key); if (!p) return;
  editKey = key;
  $("editT").textContent = L.editT; $("editX").textContent = L.close; $("editNameL").textContent = L.editName;
  $("editPriceL").textContent = L.editPrice; $("editSave").textContent = L.save;
  $("editName").value = p.title && p.title !== p.code ? p.title : "";
  $("editPrice").value = p.price ? String(p.price) : "";
  $("editBox").hidden = false; setTimeout(() => $(p.price ? "editName" : "editPrice").focus(), 50);
}
$("editX").addEventListener("click", () => { $("editBox").hidden = true; });
$("editBox").addEventListener("click", (e) => { if (e.target.id === "editBox") $("editBox").hidden = true; });
$("editSave").addEventListener("click", async () => {
  const p = (data?.products || []).find((x) => x.key === editKey); if (!p) return;
  const title = $("editName").value.trim(), raw = $("editPrice").value.replace(/[,₹\s]/g, "");
  const price = raw ? Number(raw) : null;
  if (raw && !(price > 0)) { alert(L.editBad); return; }
  const body = { key: editKey };
  if (price && price !== p.price) body.price = price;
  if (title && title !== p.title) body.title = title;
  if (!body.price && !body.title) { $("editBox").hidden = true; return; }
  $("editSave").disabled = true;
  try {
    const r = await RR.call("edit", body);
    if (r?.error === "text") { alert(L.editText); return; }
    if (r?.error) { alert(r.error === "price" ? L.editBad : L.tryAgain); return; }
    $("editBox").hidden = true; toast(L.editOk, 4000); load(true);
  } catch (e) { const m = e?.message; alert(m === "text" ? L.editText : m === "price" ? L.editBad : L.tryAgain); } finally { $("editSave").disabled = false; }
});

async function showEnded() {
  $("endedT").textContent = L.endedT; $("endedX").textContent = L.close;
  $("endedL").innerHTML = "…"; $("endedBox").hidden = false;
  try {
    const r = await RR.call("expired", {});
    $("endedL").innerHTML = r.products?.length ? r.products.map((p) => `<div class="erow"><img src="${esc(p.img || "")}" alt="" loading="lazy">
      <div><b>${esc(p.title)}</b><small>${esc([p.code, p.price ? rupees(p.price) : "", p.ended && p.ended !== "infinity" ? L.endedOn(fmtDay(p.ended)) : ""].filter(Boolean).join(" · "))}</small></div>
      <button data-relist="${p.key}" data-ids="${(p.ids || []).join(",")}">${L.relist}</button></div>`).join("") : `<div class="empty">${L.endedNone}</div>`;
  } catch { $("endedL").innerHTML = `<div class="empty">${L.tryAgain}</div>`; }
}
$("endedX").addEventListener("click", () => { $("endedBox").hidden = true; });
$("endedBox").addEventListener("click", async (e) => {
  if (e.target.id === "endedBox") { $("endedBox").hidden = true; return; }
  const b = e.target.closest("[data-relist]"); if (!b) return;
  b.disabled = true;
  try { await RR.call("relist", { key: Number(b.dataset.relist), ids: (b.dataset.ids || "").split(",").map(Number).filter(Boolean), days: 7 }); b.closest(".erow").remove(); toast(L.relistOk, 3000); load(); }
  catch { b.disabled = false; toast(L.tryAgain, 3500); }
});

function render() {
  const list = visible();
  const rt = data?.rating;
  const t2 = [];
  if (data?.role === "supplier") t2.push(`<a href="add.html?c=${encodeURIComponent(tok)}">${L.addp}</a>`, `<a href="invite.html?c=${encodeURIComponent(tok)}">${L.inv}</a>`);
  if (data) t2.push(`<button id="nameBtn">✏️ ${L.rename}</button>`);
  if (data) t2.push(`<button id="ordersBtn">${L.orders}${oFresh ? `<span class="badge">${oFresh}</span>` : ""}</button>`);
  if (data?.role === "supplier") t2.push(`<button id="endedBtn">${L.ended}</button>`);
  if (data?.role === "supplier") t2.push(`<button id="codeBtn">🔤 ${L.code}${data.code ? `: ${esc(data.code)}` : ""}</button>`);
  if (data) t2.push(`<button id="logoBtn">${data.logo ? `<img src="${esc(data.logo)}" alt="">` : "🖼"} ${L.logo}</button>`);
  $("tools2").innerHTML = t2.join(""); $("tools2").hidden = !t2.length;
  if (tok) { $("dash").hidden = false; $("dash").href = `dash.html?c=${encodeURIComponent(tok)}`; $("dash").querySelector("span").textContent = ({ hi: "डैशबोर्ड", mr: "डॅशबोर्ड" })[data?.lang] || "Dashboard"; }
  $("sub").textContent = L.sub(list.length, data?.suppliers?.length === 1 ? data.suppliers[0].name : "") +
    (rt ? ` · ${L.you}: ${rt.stars ? "★" + Number(rt.stars).toFixed(1) : L.newr}` : "");
  if (!list.length) { $("grid").innerHTML = `<div class="empty">${L.empty}</div>`; foot(); return; }
  $("grid").innerHTML = list.map((p) => `
    <div class="card${picked.has(p.key) ? " sel" : ""}" data-k="${p.key}">
      <div class="pic" data-pick="${p.key}">
        ${p.img ? `<img loading="lazy" src="${esc(p.img)}" alt="">` : p.vid ? `<video src="${esc(p.vid)}#t=0.5" preload="metadata" muted playsinline></video>` : ""}
        ${p.vid ? `<button class="play" data-play="${p.key}" aria-label="${L.vbtn}">▶</button>` : ""}
        <span class="tick">${picked.has(p.key) ? "✓" : ""}</span>
        ${p.live_until && p.live_until !== "infinity" ? `<span class="timer" data-end="${esc(p.live_until)}"></span>` : ""}
        ${p.price ? `<span class="price">${rupees(p.price)}</span>` : `<span class="noprice">${L.noprice}</span>`}
        ${p.photos > 1 || p.videos ? `<span class="count">${[p.photos > 1 ? L.photos(p.photos) : "", p.videos ? L.vids(p.videos) : ""].filter(Boolean).join(" · ")}</span>` : ""}
      </div>
      <div class="meta"><b>${esc(p.title)}</b><small>${esc([p.code, p.sizes.slice(0, 4).join(" "), p.supplier].filter(Boolean).join(" · "))}</small>
        ${p.stars ? `<div class="stars">${"★".repeat(Math.round(p.stars))}${"☆".repeat(5 - Math.round(p.stars))} ${Number(p.stars).toFixed(1)} <span>· ${L.ordered(p.orders)}</span></div>` : ""}
        ${p.desc && p.desc !== p.title ? `<div class="desc" data-desc>${esc(p.desc)}</div>` : ""}
        ${data.role === "supplier" ? `<div class="live"><span>${p.live_until === "infinity" || !p.live_until ? L.liveAlways : L.liveTill(fmtDay(p.live_until) + " " + new Date(p.live_until).toLocaleTimeString((data?.lang || "en") + "-IN", { hour: "numeric", minute: "2-digit" }))}</span><button data-edit="${p.key}">${L.edit}</button><button data-ext="${p.key}">${L.extend}</button><button data-sold="${p.key}">${L.sold}</button></div>` : ""}
        <div class="btns"><button class="one" data-one="${p.key}">${L.one}</button>${p.videos && p.photos ? `<button class="one" data-vid="${p.key}">${L.vbtn}</button>` : ""}</div></div>
    </div>`).join("");
  foot();
  tick();
}

// Countdown on every product: when it leaves sale. Updated every 30 seconds.
function leftText(ms) {
  if (ms <= 0) return L.endingNow;
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  return L.left(d ? L.dh(d, h % 24) : h ? L.hm(h, m % 60) : L.mm(Math.max(1, m)));
}
function tick() {
  const now = Date.now();
  for (const el of document.querySelectorAll("[data-end]")) {
    const ms = new Date(el.dataset.end).getTime() - now;
    el.textContent = leftText(ms);
    el.classList.toggle("soon", ms < 24 * 3600000);
  }
}
setInterval(tick, 30000);

// Orders: shown on the page and kept up to date; WhatsApp alerts continue as before.
let oList = [], oFresh = 0, oFilter = "all", ordersVer = null;
async function loadOrders() {
  try { const r = await RR.call("orders", {}); oList = r.orders || []; oFresh = r.fresh || 0; } catch { return false; }
  const b = $("ordersBtn"); if (b) b.innerHTML = `${L.orders}${oFresh ? `<span class="badge">${oFresh}</span>` : ""}`;
  if (!$("ordersBox").hidden) renderOrders();
  return true;
}
function renderOrders() {
  const sup = data?.role === "supplier", ST = sup ? L.stSup : L.st;
  const isNew = (o) => o.status === (sup ? "sent_to_supplier" : "placed");
  const groups = { all: () => true, new: isNew, open: (o) => !isNew(o) && ["sent_to_supplier", "accepted", "dispatched"].includes(o.status),
    done: (o) => o.status === "delivered", off: (o) => ["cancelled", "out_of_stock"].includes(o.status) };
  const names = { all: L.oAll, new: L.oNew, open: L.oOpen, done: L.oDone, off: L.oOff };
  $("ochips").innerHTML = Object.keys(groups).map((k) => `<button class="chip${k === oFilter ? " on" : ""}" data-of="${k}">${names[k]} (${oList.filter(groups[k]).length})</button>`).join("");
  const rows = oList.filter(groups[oFilter]);
  const when = (iso) => new Date(iso).toLocaleString((data?.lang || "en") + "-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
  $("ordersL").innerHTML = rows.length ? rows.map((o) => `<div class="orow">
      <div class="top"><b>${esc(o.no)} · ${esc(o.title || "")}</b><span class="st">${esc(ST[o.status] || o.status)}</span></div>
      <small>${esc([o.size ? `${o.size} × ${o.qty}` : `× ${o.qty}`, o.amount != null ? rupees(o.amount) : "", o.margin != null && o.margin > 0 ? L.margin(rupees(o.margin)) : "", o.pay === "cod" ? L.cod : L.upiL, L.paidL[o.paid] || ""].filter(Boolean).join(" · "))}</small>
      <small>${esc([o.customer, o.with, when(o.placed_at), o.web ? L.fromWeb : ""].filter(Boolean).join(" · "))}</small>
      ${o.address ? `<small>📍 ${esc(o.address)}</small>` : ""}
      <div>${o.phone && !sup ? `<a href="tel:${esc(o.phone)}">📞 ${L.call}</a>` : ""}${o.tracking ? `<a href="https://www.google.com/search?q=${encodeURIComponent(o.tracking + " tracking")}" target="_blank" rel="noopener">🚚 ${L.track} ${esc(o.tracking)}</a>` : ""}</div>
    </div>`).join("") : `<div class="empty">${L.ordersNone}</div>`;
}
async function showOrders() {
  $("ordersT").textContent = L.ordersT; $("ordersX").textContent = L.close; $("ohint").textContent = L.oHint;
  $("ordersBox").hidden = false; $("ordersL").innerHTML = "…";
  if (!(await loadOrders())) $("ordersL").innerHTML = `<div class="empty">${L.tryAgain}</div>`; else renderOrders();
}
$("ordersX").addEventListener("click", () => { $("ordersBox").hidden = true; });
$("ordersBox").addEventListener("click", (e) => {
  if (e.target.id === "ordersBox") { $("ordersBox").hidden = true; return; }
  const c = e.target.closest("[data-of]"); if (c) { oFilter = c.dataset.of; renderOrders(); }
});

function foot() {
  $("foot").classList.toggle("show", picked.size > 0);
  $("n").textContent = L.sel(picked.size);
}

async function fileFrom(url, name) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("photo");
  const b = await r.blob();
  return new File([b], name, { type: b.type || (name.endsWith(".mp4") ? "video/mp4" : "image/jpeg") });
}

// Gets each product's stamped photo and caption, then opens the phone's share sheet (WhatsApp, Status…).
async function share(keys, videoOnly = false) {
  if (keys.length > 10) { toast(L.max); return; }
  busy(true);
  let items = [], skipped = 0;
  try {
    const got = await Promise.all(keys.map((k) => fetch(`${API}?c=${encodeURIComponent(tok)}&share=${k}`).then((r) => (r.ok ? r.json() : null)).catch(() => null)));
    items = got.filter(Boolean);
    skipped = keys.length - items.length;
    if (!items.length) { toast(L.sold); return; }
    const text = items.map((i) => i.text).join("\n\n— — —\n\n");
    try { await navigator.clipboard.writeText(text); } catch { /* not allowed: fine */ }
    const files = [];
    for (const i of items) {
      const img = i.media.find((x) => x.kind === "image" && x.url);
      const vids = i.media.filter((x) => x.kind === "video" && x.url);
      const pick = videoOnly || !img ? vids.slice(0, 3) : [img];
      for (const [n, m] of pick.entries()) {
        try { files.push(await fileFrom(m.url, m.kind === "video" ? `${i.code}${n ? "-" + (n + 1) : ""}.mp4` : `${i.code}.jpg`)); } catch { /* skip this one */ }
      }
    }
    busy(false);
    if (files.length && navigator.canShare && navigator.canShare({ files })) {
      try { await navigator.share({ files, text }); }
      catch (e) {
        if (e && e.name === "AbortError") return;
        // iPhone: preparing big files (videos) takes too long after the tap, so ask for one more tap to share
        if (e && e.name === "NotAllowedError") { readyToShare({ files, text }); return; }
        throw e;
      }
      toast(skipped ? L.sold : L.copied, 3500);
    } else {
      toast(L.nofile, 5000);
      setTimeout(() => { location.href = `https://wa.me/?text=${encodeURIComponent(text)}`; }, 1200);
    }
  } catch (e) {
    toast(L.fail);
  } finally { busy(false); }
}

// iPhone Safari only plays sound-on video when play() runs inside the tap itself, so start it here
// (no autoplay attribute). If the phone still can't play it, offer its own player via a plain link.
function openVideo(url) {
  const v = document.createElement("div");
  v.className = "viewer";
  v.innerHTML = `<button class="vclose">${L.close}</button><div class="vwrap"></div>
    <p class="vmsg" hidden></p><a class="vopen" href="${esc(url)}" target="_blank" rel="noopener">${L.vopen}</a>`;
  const vid = document.createElement("video");
  vid.controls = true; vid.playsInline = true; vid.preload = "auto";
  vid.setAttribute("playsinline", ""); vid.setAttribute("webkit-playsinline", "");
  vid.src = url;
  v.querySelector(".vwrap").appendChild(vid);
  v.querySelector(".vclose").onclick = () => { vid.pause(); vid.removeAttribute("src"); vid.load(); v.remove(); };
  vid.addEventListener("error", () => {
    const m = v.querySelector(".vmsg");
    m.hidden = false; m.textContent = L.vfail + (vid.error ? ` (${vid.error.code})` : "");
  });
  document.body.appendChild(v);
  const p = vid.play();
  if (p && p.catch) p.catch(() => { vid.muted = true; vid.play().catch(() => null); });
}

function readyToShare(payload) {
  const b = document.createElement("div");
  b.className = "ready";
  b.innerHTML = `<button class="go">📤 ${L.tapShare}</button><button class="x">✕</button>`;
  b.querySelector(".x").onclick = () => b.remove();
  b.querySelector(".go").onclick = async () => {
    b.remove();
    try { await navigator.share(payload); toast(L.copied, 3500); } catch (e) { if (!e || e.name !== "AbortError") toast(L.fail); }
  };
  document.body.appendChild(b);
}

async function toWebsite() {
  busy(true);
  try {
    const r = await fetch(`${API}?c=${encodeURIComponent(tok)}&web=${[...picked].join(",")}`, { method: "POST" });
    const j = await r.json();
    toast(L.added(j.added || 0));
  } catch { toast(L.fail); } finally { busy(false); }
}

$("grid").addEventListener("click", (e) => {
  const d = e.target.closest("[data-desc]");
  if (d) { d.classList.toggle("open"); return; }
  const pl = e.target.closest("[data-play]");
  if (pl) { const p = (data?.products || []).find((x) => x.key === Number(pl.dataset.play)); if (p?.vid) openVideo(p.vid); return; }
  const vb = e.target.closest("[data-vid]");
  if (vb) { share([Number(vb.dataset.vid)], true); return; }
  const one = e.target.closest("[data-one]");
  if (one) { share([Number(one.dataset.one)]); return; }
  const pick = e.target.closest("[data-pick]");
  if (!pick) return;
  const k = Number(pick.dataset.pick);
  if (picked.has(k)) picked.delete(k); else if (picked.size >= 10) { toast(L.max); return; } else picked.add(k);
  const card = pick.closest(".card");
  card.classList.toggle("sel", picked.has(k));
  card.querySelector(".tick").textContent = picked.has(k) ? "✓" : "";
  foot();
});
$("days").addEventListener("click", (e) => { const b = e.target.closest("[data-d]"); if (!b) return; days = Number(b.dataset.d); picked.clear(); load(); });
$("q").addEventListener("input", render);
$("sup").addEventListener("change", render);
$("sort").addEventListener("change", render);
$("tools2").addEventListener("click", async (e) => {
  if (e.target.closest("#logoBtn")) { $("fLogo").click(); return; }
  if (e.target.closest("#endedBtn")) { showEnded(); return; }
  if (e.target.closest("#ordersBtn")) { showOrders(); return; }
  if (e.target.closest("#codeBtn")) {
    const c = prompt(L.codeAsk, data?.code || "");
    if (c === null || !c.trim() || c.trim().toUpperCase() === data?.code) return;
    try { const r = await RR.call("code", { code: c.trim() }); toast(L.codeSet(r.code), 4000); load(); } catch { toast(L.codeBad, 4000); }
    return;
  }
  if (!e.target.closest("#nameBtn")) return;
  const name = prompt(L.renameAsk, data?.shop || "");
  if (name === null || !name.trim() || name.trim() === data?.shop) return;
  try { await RR.call("rename", { name: name.trim() }); toast(L.renamed); load(); } catch { toast(L.renameBad, 4000); }
});
$("fLogo").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  busy(true);
  try {
    const blob = await RR.shrink(f, 600, true);
    const [path] = await RR.upload([blob], "logo");
    if (!path) throw new Error("upload");
    await RR.call("logo", { path });
    toast(L.logoSet, 3500);
    load();
  } catch { toast(L.logoFail); } finally { busy(false); }
});
$("share").addEventListener("click", () => share([...picked]));
$("clear").addEventListener("click", () => { picked.clear(); render(); });
$("web").addEventListener("click", toWebsite);
labels();
// Live: check every 20 seconds while the page is open (a tiny request) and refresh when anything changed.
async function checkLive() {
  if (document.hidden || !tok || !data) return;
  try {
    const r = await fetch(`${API}?c=${encodeURIComponent(tok)}&act=ver`, { cache: "no-store" });
    if (!r.ok) return;
    const { v, ov } = await r.json();
    if (ver !== null && v !== ver) { await load(true); toast(L.updated, 3500); }
    ver = v;
    if (ov !== undefined && ov !== ordersVer) {
      const before = oFresh, first = ordersVer === null;
      ordersVer = ov;
      await loadOrders();
      if (!first && oFresh > before) toast(L.newOrder, 5000);
    }
  } catch {}
}
setInterval(checkLive, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkLive(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
load().then(checkLive);
</script>
