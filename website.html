<!DOCTYPE html>

<head>
<meta charset="utf-8">

<title>Your websites · Resell Ready</title>
<style>
  :root { --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --brand:#0f766e; --brand-soft:#e6f4f1; --bg:#f6f7f8; --bad:#b91c1c; --ok:#15803d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif; color:var(--ink); background:var(--bg); padding-bottom:40px; }
  header { background:var(--brand); color:#fff; padding:14px 16px 12px; position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-size:19px; } header p { margin:3px 0 0; font-size:13px; opacity:.9; } header a { color:#fff; }
  main { max-width:760px; margin:0 auto; padding:12px; display:grid; gap:12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; display:grid; gap:10px; }
  .card h2 { margin:0; font-size:16.5px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .card p { margin:0; font-size:13.5px; line-height:1.45; color:var(--muted); }
  .tag { font-size:12px; font-weight:600; padding:3px 8px; border-radius:999px; background:#eef0f2; color:var(--muted); white-space:nowrap; }
  .tag.on { background:#dcfce7; color:var(--ok); }
  .link { display:flex; gap:6px; } .link input { flex:1; min-width:0; }
  input, select { font:inherit; font-size:15px; padding:10px 11px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); width:100%; }
  label { display:grid; gap:5px; font-size:13px; color:var(--muted); }
  .mk { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  button, .btn { font:inherit; font-size:14px; font-weight:600; border-radius:10px; padding:10px 14px; cursor:pointer; border:1px solid var(--brand); background:#fff; color:var(--brand); text-decoration:none; text-align:center; }
  button.main { background:var(--brand); color:#fff; }
  button.bad { border-color:#fca5a5; color:var(--bad); }
  button:disabled { opacity:.5; }
  .stat { font-size:13.5px; line-height:1.5; } .stat b { color:var(--ink); }
  .err { color:var(--bad); font-size:13.5px; } .okmsg { color:var(--ok); font-size:13.5px; }
  details { font-size:13.5px; line-height:1.5; } summary { cursor:pointer; color:var(--brand); font-weight:600; }
  details ol { padding-left:20px; margin:8px 0 0; } details li { margin:3px 0; }
  .sw { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--ink); } .sw input { width:auto; }
  .note { font-size:12.5px; color:var(--muted); }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#111827; color:#fff; padding:10px 14px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; }
  #toast.show { opacity:1; }
</style>
</head>

  <label>${L.amount}<input id="${id}A" inputmode="decimal" value="${esc(amt ?? 0)}"></label></div><p class="note">${L.markupHelp}</p>`;

  if (s) return `<div class="card" data-pf="${pf}"><h2>${title}<span class="tag on">✓ ${L.connected}</span></h2>
    <p><b>${esc(s.name || s.url)}</b></p>
    <div class="stat">${[L.live(s.live), L.off(s.off), s.failed ? L.failed(s.failed) : "", L.last(when(s.last_sync_at))].filter(Boolean).join(" · ")}</div>
    ${s.last_error ? `<div class="err">⚠️ ${esc(s.last_error)}</div>` : ""}
    ${mkFields(pf, s.markup_type, s.markup)}
    <label class="sw"><input type="checkbox" id="${pf}E"${s.enabled ? " checked" : ""}> ${L.autoOn}</label>
    <div class="btns"><button class="main" data-save="${pf}">${L.save}</button><button data-sync="${pf}">${L.syncNow}</button><button class="bad" data-dis="${pf}">${L.disconnect}</button></div></div>`;
  return `<div class="card" data-pf="${pf}"><h2>${title}<span class="tag">${L.notConnected}</span></h2><p>${about}</p>
    ${pf === "shopify" ? `<label>${L.shopUrl}<input id="shopifyU" placeholder="yourshop.myshopify.com" autocapitalize="off"></label>
      <label>${L.shopTok}<input id="shopifyK" placeholder="shpat_…" autocapitalize="off" autocomplete="off"></label>`
    : `<label>${L.wooUrl}<input id="woocommerceU" placeholder="https://yourshop.com" autocapitalize="off"></label>
      <label>${L.wooKey}<input id="woocommerceK" placeholder="ck_…" autocapitalize="off" autocomplete="off"></label>
      <label>${L.wooSec}<input id="woocommerceS" placeholder="cs_…" autocapitalize="off" autocomplete="off"></label>`}
    ${mkFields(pf, "pct", 0)}
    <details><summary>${pf === "shopify" ? L.howShop : L.howWoo}</summary><ol>${steps.map((x) => `<li>${x}</li>`).join("")}</ol></details>
    <p class="note">🔒 ${L.keysNote}</p><div class="err" id="${pf}Err"></div>
    <div class="btns"><button class="main" data-connect="${pf}">${L.connect}</button></div></div>`;
}

function render() {
  const f = S.free;
  $("main").innerHTML = `
  <div class="card"><h2>${L.freeT}<span class="tag ${f.public ? "on" : ""}">${f.public ? "✓" : "—"}</span></h2><p>${L.freeP}</p>
    <div class="link"><input id="freeUrl" readonly value="${esc(f.url)}"><button data-copy="freeUrl">${L.copy}</button></div>
    <div class="btns"><a class="btn" href="${esc(f.url)}" target="_blank" rel="noopener">${L.open}</a><a class="btn" href="https://wa.me/?text=${encodeURIComponent(L.shareText(f.url))}" target="_blank" rel="noopener">${L.shareWa}</a></div>
    ${mkFields("free", f.markup_type, f.markup)}
    <label class="sw"><input type="checkbox" id="freeP"${f.public ? " checked" : ""}> ${L.publicL}</label>
    <div class="btns"><button class="main" data-save="free">${L.save}</button></div></div>
  ${siteCard("shopify")}
  ${siteCard("woocommerce")}
  <div class="card"><h2>${L.feedT}</h2><p>${L.feedP}</p>
    <div class="link"><input id="feedUrl" readonly value="${esc(S.feed)}"><button data-copy="feedUrl">${L.copy}</button></div></div>`;
}

async function load() {
  try {
    const d = await RR.info();
    L = T[d.lang] || T.en; document.documentElement.lang = d.lang || "en";
    $("h").textContent = L.h; $("back").textContent = L.back; $("back").href = `./?c=${encodeURIComponent(RR.tok)}`;
    if (d.role !== "supplier") { $("main").innerHTML = `<div class="card"><p>${L.only}</p></div>`; return; }
    S = await RR.call("site", {});
    render();
  } catch { $("main").innerHTML = `<div class="card"><p>${L.bad}</p></div>`; }
}

const mk = (id) => ({ markup_type: $(`${id}T`).value, markup: Number(String($(`${id}A`).value).replace(/[^\d.]/g, "")) || 0 });
$("main").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.copy) {
    const v = $(b.dataset.copy).value;
    try { await navigator.clipboard.writeText(v); } catch { $(b.dataset.copy).select(); document.execCommand("copy"); }
    toast(L.copied); return;
  }
  b.disabled = true;
  try {
    if (b.dataset.save === "free") { await RR.call("sitesave", { free: { ...mk("free"), public: $("freeP").checked } }); toast(L.saved); }
    else if (b.dataset.save) { const pf = b.dataset.save; await RR.call("sitesave", { sites: [{ platform: pf, ...mk(pf), enabled: $(`${pf}E`).checked }] }); toast(L.saved); }
    else if (b.dataset.connect) {
      const pf = b.dataset.connect; $(`${pf}Err`).textContent = ""; b.textContent = L.connecting;
      const body = pf === "shopify" ? { platform: pf, url: $("shopifyU").value, token: $("shopifyK").value, ...mk(pf) }
        : { platform: pf, url: $("woocommerceU").value, key: $("woocommerceK").value, secret: $("woocommerceS").value, ...mk(pf) };
      try { const r = await RR.call("siteconnect", body); toast(L.connectedOk(r.name), 5000); }
      catch (err) { $(`${pf}Err`).textContent = err.message || L.tryAgain; b.textContent = L.connect; return; }
    } else if (b.dataset.sync) {
      b.textContent = L.syncing;
      const r = await RR.call("sitesync", { platform: b.dataset.sync });
      const x = (r.results || [])[0]; if (x) toast(x.error ? `⚠️ ${x.error}` : L.synced(x), 5000);
    } else if (b.dataset.dis) {
      if (!confirm(L.disAsk)) return;
      await RR.call("sitedisconnect", { platform: b.dataset.dis }); toast(L.disOk);
    }
    S = await RR.call("site", {}); render();
  } catch { toast(L.tryAgain); } finally { b.disabled = false; }
});
load();
</script>
</body>
</html>
